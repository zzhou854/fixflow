[project]
name = "fixflow"
version = "0.1.0"
description = "Recoverable and auditable property-maintenance coordination agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.18.5,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.139,<0.140",
    "httpx>=0.28,<1",
    "mcp>=1.28.1,<2",
    "pgvector>=0.4,<1",
    "pydantic-settings>=2.10,<3",
    "sqlalchemy[asyncio]>=2.0.51,<2.1",
    "structlog>=25.4,<26",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.16,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.0,<2",
    "ruff>=0.12,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["backend", "tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
