name: fixflow

x-python-service: &python-service
  build:
    context: .
    dockerfile: Dockerfile
  image: fixflow-python:${FIXFLOW_IMAGE_TAG:-local}
  init: true
  restart: "no"

x-product-environment: &product-environment
  FIXFLOW_ENVIRONMENT: production
  FIXFLOW_RUNTIME_MODE: production
  FIXFLOW_DEBUG: "false"
  FIXFLOW_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fixflow}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fixflow}
  CHECKPOINT_DATABASE_URL: postgresql://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@postgres:5432/${CHECKPOINT_POSTGRES_DB:-fixflow_checkpoints}
  FIXFLOW_PROPERTY_OPERATIONS_MCP_URL: http://mcp-server:8765/mcp
  FIXFLOW_JWT_SECRET: ${FIXFLOW_JWT_SECRET:?Set FIXFLOW_JWT_SECRET in .env}
  FIXFLOW_JWT_ALGORITHM: HS256
  FIXFLOW_JWT_ACCESS_TOKEN_MINUTES: ${FIXFLOW_JWT_ACCESS_TOKEN_MINUTES:-30}
  FIXFLOW_CORS_ORIGINS: ${FIXFLOW_CORS_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
  FIXFLOW_ALLOWED_HOSTS: ${FIXFLOW_ALLOWED_HOSTS:-127.0.0.1,localhost,api}
  FIXFLOW_LLM_PROVIDER: scripted
  FIXFLOW_LLM_EXPERIMENTAL_ENABLED: "false"
  FIXFLOW_LLM_ONLINE_ENABLED: "false"
  FIXFLOW_LLM_SHADOW_ENABLED: "false"
  FIXFLOW_LLM_GROUNDED_RESPONSE_ENABLED: "false"
  FIXFLOW_LLM_ONLINE_RUNTIME_MODE: demo_safe
  FIXFLOW_LLM_ONLINE_QUALIFICATION_STATUS: NOT_ACTIVATED
  FIXFLOW_LLM_MODEL_BUDGET_SECONDS: "25"
  FIXFLOW_RUNTIME_REVISION: ${FIXFLOW_RUNTIME_REVISION:-container-local}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fixflow} -d ${POSTGRES_DB:-fixflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - fixflow-postgres-data:/var/lib/postgresql/data

  checkpoint-init:
    <<: *python-service
    environment: *product-environment
    command: ["python", "-m", "app.agent_runtime.initialize_checkpoints"]
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    <<: *python-service
    environment: *product-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  mcp-server:
    <<: *python-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fixflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fixflow}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8765
    command: ["python", "-m", "mcp_server"]
    expose:
      - "8765"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1',8765),2); s.close()"
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *python-service
    restart: unless-stopped
    environment:
      <<: *product-environment
      API_HOST: 0.0.0.0
      API_PORT: 8000
    command: ["python", "-m", "app.api.run"]
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      checkpoint-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://127.0.0.1:8000}
    image: fixflow-frontend:${FIXFLOW_IMAGE_TAG:-local}
    init: true
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fixflow-postgres-data:
